    - Home: index.md
    - Installation: getting-started/installation.md
    - Quick Start: getting-started/quickstart.md
    - Basic Concepts: getting-started/basic-concepts.md
    - Configuration: getting-started/configuration.md
    - Backend Selection: getting-started/backend-selection.md
  - User Guide:
    - Overview: user-guide/overview.md
    - Supervised Fine-Tuning (SFT): user-guide/sft.md
    - Reinforcement Learning (RL): user-guide/rl.md
    - Distillation: user-guide/distillation.md
    - Reward Functions: user-guide/reward-functions.md
    - Reward Model Training: user-guide/reward-model-training.md
    - Evaluation: user-guide/evaluation.md
    - Model Management: user-guide/model-management.md
    - Sample Logging: user-guide/sample-logging.md
    - Troubleshooting: user-guide/troubleshooting.md
  - Algorithms:
    - Overview: algorithms/overview.md
    - DPO: algorithms/dpo.md
    - Online-DPO: algorithms/online-dpo.md
    - PPO: algorithms/ppo.md
    - GRPO: algorithms/grpo.md
    - GSPO: algorithms/gspo.md
    - DAPO: algorithms/dapo.md
    - Dr. GRPO: algorithms/dr-grpo.md
    - GBMPO: algorithms/gbmpo.md
    - Counterfactual GRPO: algorithms/counterfactual-grpo.md
    - PACE: algorithms/pace.md
    - ORPO: algorithms/orpo.md
    - SPIN: algorithms/spin.md
    - RAFT: algorithms/raft.md
  - API Reference:
    - Parameter Reference: PARAMETERS.md
    - Backends:
      - Overview: backends/overview.md
      - TRL Backend: backends/trl.md
      - Unsloth Backend: backends/unsloth.md
      - Comparison: backends/comparison.md
    - API Reference:
      - Overview: api-reference/overview.md
      - Core API: api-reference/core.md
      - Backend Factory: api-reference/backend-factory.md
      - Configuration Classes: api-reference/configuration.md
      - Trainers: api-reference/trainers.md
      - Unified API: api-reference/unified-api.md
      - Reward Functions Reference: api-reference/reward-functions-reference.md
      - Reward Model Training Reference: api-reference/reward-model-training-reference.md
  - Advanced Topics:
    - Architecture: advanced/architecture.md
    - Advanced Adapters (PEFT): advanced/adapters.md
    - Model Merging: advanced/merging.md
    - Long-Context & Attention: advanced/long-context.md
    - Tokenization & Multilingual: advanced/tokenization.md
    - Distillation Internals: advanced/distillation.md
    - Production Compositions: advanced/composition.md
    - Indic / Regional Post-Training: advanced/indic.md
  - Tutorials:
    - Overview: examples/overview.md
    - SFT Examples: examples/sft.md
    - RL Examples: examples/rl.md
    - Distillation Examples: examples/distillation.md
    - Advanced Examples: examples/advanced.md
    - Demo Notebooks: notebooks/demo.md
    - Lexsi SDK Notebooks: notebooks/lexsi-sdk.md
    - Standalone Tokenizer: notebooks/tokenizer_embedding_adaptation_experiment.ipynb
    - Local Notebooks: notebooks/local.md
  - Community:
    - CLI:
      - CLI Reference: cli-reference.md
      - CLI Overview: cli/overview.md
      - CLI Commands: cli/commands.md
      - CLI Configuration Files: cli/configuration.md
      - Raw Factory CLI Configs: cli/raw-factory-configs.md
    - Compatibility:
      - Unsloth Compatibility: unsloth_compatibility.md
      - Backend Support Matrix: compatibility/backend-matrix.md
    - Contributing:
      - Contributing Guide: contributing/guide.md
      - Code Style: contributing/code-style.md
      - Testing: contributing/testing.md
    - FAQ: community/faq.md
    - Roadmap: novelty_frontiers.md
    - Changelog: CHANGELOG.md
    - Known Issues: ISSUES.md
    - Code of Conduct: CODE_OF_CONDUCT.md
    - Security Policy: SECURITY.md

extra:
  version:
    provider: mike
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Lexsi-Labs/aligntune
      name: AlignTune on GitHub
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/aligntune/
      name: AlignTune on PyPI
    - icon: fontawesome/brands/discord
      link: https://discord.gg/ckVbEJGW
      name: AlignTune on Discord
    - icon: fontawesome/solid/globe
      link: https://lexsi.ai
      name: Lexsi Labs

plugins:
  - search
  - mkdocs-jupyter
  - mkdocstrings:
      handlers:
        python:
          paths:
            - src/aligntune
          options:
            show_source: true
            show_root_heading: true
            heading_level: 3
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            merge_init_into_class: true
            docstring_section_style: table
            allow_inspection: false
