algo: bolt

model:
  name_or_path: "Qwen/Qwen3-1.7B"
  precision: bf16
  gradient_checkpointing: true
  max_seq_length: 1024
  use_peft: true
  lora_r: 32
  lora_alpha: 32
  lora_target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]
  lora_dropout: 0.1

datasets:
  - name: "mbpp"
    split: "train"

rewards:
  - type: code_execution
    weight: 1.0
    params: {}

train:
  epochs: 3
  max_steps: 1000
  beta: 0.005

  enable_thinking: false
  use_gradient_checkpointing: true

  per_device_batch_size: 32
  gradient_accumulation_steps: 2
  num_generations: 16
  learning_rate: 2.5e-5
  max_prompt_length: 512
  max_completion_length: 512
  temperature: 0.6
  top_p: 0.95

  # VANILLA: baseline tracking (for logging) but NO curriculum, NO baseline advantages
  baseline_enabled: true
  use_baseline_advantages: false
  baseline_warm_start: "baselines/mbpp_baseline_qwen3_1.7b.json"
  baseline_rho_min: 0.875
  baseline_rho_max: 0.96
  baseline_D_half: 0.5

  curriculum_enabled: false
  curriculum_epsilon: 0.05
  curriculum_update_freq: 10

  save_steps: 250
  logging_steps: 1
  seed: 42

logging:
  output_dir: "output/ablation_vanilla"
  run_name: "ablation_vanilla"
  loggers: []
  wandb_project: "bolt-ablation"

distributed:
  backend: single

chat_template: auto
