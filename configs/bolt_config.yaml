algo: bolt

model:
  name_or_path: "Qwen/Qwen3-1.7B"
  precision: bf16
  gradient_checkpointing: true
  max_seq_length: 1024
  use_peft: true
  lora_r: 32
  lora_alpha: 32
  lora_target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]
  lora_dropout: 0.1

datasets:
  - name: "openai/gsm8k"
    split: "train"
    system_prompt: "You are a careful math tutor. Solve step by step and provide the final numeric answer."

rewards:
  - type: math
    weight: 1.0
    params: {}

train:
  epochs: 1
  max_steps: 200
  per_device_batch_size: 16
  gradient_accumulation_steps: 1
  num_generations: 8
  learning_rate: 0.00005
  max_prompt_length: 256
  max_completion_length: 768
  enable_thinking: false
  loss_type: dapo
  beta: 0.005
  epsilon: 0.2
  scale_rewards: group
  temperature: 0.6
  top_p: 0.95
  max_grad_norm: 0.0

  # BOLT baseline settings
  baseline_enabled: true
  baseline_warm_start: "baselines/gsm8k_qwen3_1.7b_full.json"
  use_baseline_advantages: true
  baseline_rho_min: 0.875
  baseline_rho_max: 0.96
  baseline_D_half: 0.5

  # BOLT curriculum settings
  curriculum_enabled: true
  curriculum_epsilon: 0.05
  curriculum_update_freq: 10

  # Checkpointing
  save_steps: 25
  save_total_limit: 0
  logging_steps: 10

  # Gradient checkpointing
  use_gradient_checkpointing: true

  # Seeds
  seed: 42
  data_seed: 47

logging:
  output_dir: "/datasets/second-disk/finetunehub_bolt_test"
  run_name: "bolt_gsm8k_baseline"
  loggers: ["wandb"]
  wandb_project: "bolt-training"

distributed:
  backend: single

caching:
  root: "cache"
  enabled: true

chat_template: auto
