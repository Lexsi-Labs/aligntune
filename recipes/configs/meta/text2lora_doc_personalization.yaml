# Doc-to-LoRA Document Personalization Configuration (v3.3 Advanced Parameterization)
#
# This configuration enables generating LoRA adapters from extended task documents.
# Unlike text2lora_meta_training.yaml which uses short embeddings, this recipe
# processes long documents by chunking, embedding chunks, and pooling for better
# context capture.
#
# Workflow:
# 1. Load trained Text-to-LoRA hypernetwork checkpoint
# 2. Process document: chunk → embed chunks → pool embeddings
# 3. Feed pooled embedding to hypernetwork
# 4. Generate LoRA weights optimized for document-described task
# 5. Apply to base model at inference time
#
# Key differences from text2lora_meta_training.yaml:
# - Accepts full document input (not just embedding)
# - Handles overlapping chunks for context preservation
# - Weighted attention pooling for relevance-aware combination
# - Suitable for detailed task specifications

# ============================================================================
# HYPERNETWORK CHECKPOINT
# ============================================================================
hypernet_checkpoint:
  # Path to trained TextToLoRAHypernet checkpoint
  path: "./checkpoints/text2lora/best_hypernet.pt"

  # Hypernetwork configuration (must match checkpoint)
  config:
    hidden_dim: 768
    lora_r: 16
    num_target_modules: 5
    mlp_hidden: 512
    embedding_model_name: "all-MiniLM-L6-v2"
    lora_init_std: 0.02

# ============================================================================
# DOCUMENT-TO-LORA CONFIGURATION
# ============================================================================
doc2lora:
  # Chunk size in characters for splitting documents
  # Smaller values: more fine-grained chunks, higher noise
  # Larger values: coarser chunks, potentially lost detail
  chunk_size: 512

  # Maximum number of chunks to process per document
  # Excess chunks are dropped; documents shorter than chunk_size use 1 chunk
  num_chunks: 3

  # Pooling strategy for combining chunk embeddings:
  # - "mean": Simple average of chunk embeddings (lightweight, deterministic)
  # - "weighted": Attention-based pooling (learnable, context-aware)
  pooling_strategy: "weighted"

  # Device for computation
  device: "cpu"

# ============================================================================
# BASE MODEL CONFIGURATION
# ============================================================================
base_model:
  # Model to apply generated LoRA adapters to
  model_name: "meta-llama/Llama-2-7b"

  # Modules targeted by generated LoRA pairs
  # Must have num_target_modules entries
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "up_proj"

  # Freeze base model weights (LoRA only)
  freeze_base: true

# ============================================================================
# INFERENCE CONFIGURATION
# ============================================================================
inference:
  # Scaling factor for LoRA contribution (alpha/r in LoRA computation)
  lora_scaling: 1.0

  # Maximum sequence length for document input
  max_document_length: 4096

  # Device for inference
  device: "cpu"

