# ============================================================================
# COMPARISON: Text-to-LoRA vs Doc-to-LoRA
# ============================================================================
#
# Text-to-LoRA (meta_training):
# ✓ Fast: Direct embedding → LoRA generation
# ✓ Lightweight: Single forward pass
# ✗ Limited context: Word-level embedding only (~100 tokens)
# ✗ Task description must be concise
#
# Doc-to-LoRA (doc_personalization):
# ✓ Rich context: Processes full document (512 chars × 3 chunks)
# ✓ Structured input: Supports detailed specifications
# ✓ Flexible: Handles variable-length documents
# ✗ Slower: Chunking + embedding + pooling overhead
# ✗ Higher memory: Multiple chunk embeddings
#
# Choose Doc-to-LoRA when:
# - Task requires detailed specification (>500 words)
# - Document contains multiple contexts/examples
# - High accuracy is prioritized over latency
#
# Choose Text-to-LoRA when:
# - Task is concise (<100 words)
# - Real-time generation needed
# - Inference latency critical
