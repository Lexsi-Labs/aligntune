# Qwen2.5-0.5B for BFSI Instruction Tuning
# Ultra-efficient small model for banking, financial, and regulatory Q&A
# ~500M params, fits on edge devices and CPU inference
# Optimized for KYC, compliance, RBI circular understanding

backend: trl
training_type: sft

model:
  model_name_or_path: Qwen/Qwen2.5-0.5B
  torch_dtype: bfloat16
  attn_implementation: flash_attention_2
  device_map: auto

tokenizer:
  model_name_or_path: Qwen/Qwen2.5-0.5B
  trust_remote_code: true
  use_fast: true

dataset:
  type: huggingface
  dataset_name: null  # User-provided BFSI instruction dataset
  dataset_config_name: null
  split: train
  streaming: false
  preprocessing:
    max_seq_length: 2048
    padding: max_length
    truncation: true
    instruction_column: instruction
    response_column: response
    context_column: context

training:
  output_dir: ./outputs/qwen25_0_5b_bfsi
  overwrite_output_dir: true

  # Aggressive learning rate for small model
  learning_rate: 3.0e-4
  lr_scheduler_type: cosine
  warmup_steps: 50
  warmup_ratio: 0.05

  # Batch sizes optimized for 0.5B model
  per_device_train_batch_size: 16
  gradient_accumulation_steps: 1

  # Quick training for rapid iteration
  num_train_epochs: 2
  max_steps: -1

  # Optimizer
  optim: adamw_torch
  weight_decay: 0.001

  # Gradient handling
  max_grad_norm: 1.0
  gradient_checkpointing: false

  # Evaluation
  evaluation_strategy: steps
  eval_steps: 300
  per_device_eval_batch_size: 16

  # Logging and saving
  logging_dir: ./logs
  logging_steps: 25
  save_strategy: steps
  save_steps: 300
  save_total_limit: 2

  # Performance
  seed: 42
  dataloader_drop_last: true
  dataloader_num_workers: 2

  # Generation parameters
  max_new_tokens: 256
  temperature: 0.7
  top_p: 0.9

# Minimal LoRA for 0.5B model
peft:
  peft_type: lora
  r: 8
  lora_alpha: 16
  lora_dropout: 0.05
  target_modules:
    - q_proj
    - v_proj
  bias: none
  task_type: CAUSAL_LM

# No quantization needed for small model (fits easily on small GPUs/CPUs)
quantization:
  load_in_8bit: false
  load_in_4bit: false

# BFSI Task Configuration
task:
  task_type: instruction_following
  instruction_column: instruction
  response_column: response
  context_column: context

# Notes:
# - Qwen2.5-0.5B is ideal for edge deployment (50MB quantized)
# - Optimized for Indian banking terminology
# - Fast inference: 30-50ms per token on CPU
# - Recommended datasets: RBI circular Q&A, KYC FAQs, complaint resolution
# - Fine-tune on domain-specific BFSI instruction pairs
