recipe:
  name: "mixtral-8x7b-qlora-sft"
  description: "Fine-tune Mixtral-8x7B MoE model using per-expert LoRA with 4-bit quantization for memory-efficient training"
  model: "mistralai/Mixtral-8x7B-Instruct-v0.1"
  dataset: "Open-Orca/SlimOrca"
  task: "instruction_following"
  algorithm: "sft"
  backend: "trl"
  tags: ["mixtral", "moe", "qlora", "per-expert-lora", "v3.5-moe-native-support"]
  requires_auth: true
  estimated_time: "6-8 hours"
  estimated_memory: "40GB VRAM (with QLoRA: ~16GB VRAM)"

config:
  algo: sft

  model:
    name_or_path: "mistralai/Mixtral-8x7B-Instruct-v0.1"
    precision: "bf16"
    gradient_checkpointing: true
    use_peft: true

    # MoE Configuration
    moe_enabled: true
    num_experts: 8
    expert_discovery: "mixtral"

    # LoRA Configuration for Per-Expert Adaptation
    lora_variant: "default"
    lora_r: 16
    lora_alpha: 32
    lora_dropout: 0.05
    lora_target_modules:
      - "q_proj"
      - "k_proj"
      - "v_proj"
      - "o_proj"
      - "gate_proj"
      - "up_proj"
      - "down_proj"
      - "w1"
      - "w2"
      - "w3"

    # Advanced PEFT methods
    dora_enabled: false
    rslora_enabled: false
    loftq_init: false
    pissa_init: false

    # 4-bit Quantization for Memory Efficiency
    load_in_4bit: true
    bnb_4bit_compute_dtype: "bfloat16"
    bnb_4bit_quant_type: "nf4"
    bnb_4bit_use_double_quant: true

    trust_remote_code: true

  datasets:
    - name: "Open-Orca/SlimOrca"
      split: "train"
      max_samples: 50000
      column_mapping:
        text: "conversations"

  train:
    # Memory-efficient settings for 8x7B model
    epochs: 1
    per_device_batch_size: 1
    gradient_accumulation_steps: 16
    learning_rate: 1e-4
    warmup_steps: 100
    max_grad_norm: 1.0
    optimizer: "adamw_4bit"
    lr_scheduler: "cosine"
    logging_steps: 10
    save_steps: 500
    eval_steps: 500
    seed: 42

    # Additional training configs
    max_seq_length: 2048
    packing: true

    # Expert-specific training (optional)
    expert_sampling_strategy: "uniform"  # Options: uniform, adaptive, gradient-based
    expert_warmup_steps: 500

  logging:
    output_dir: "./output/mixtral-8x7b-qlora-sft"
    run_name: "mixtral-8x7b-moe-instruction"
    loggers: []
    report_to: "none"

  distributed:
    backend: "single"
    # For multi-GPU: set to "nccl"

  chat_template: "mixtral"

# Notes on Mixtral MoE Training:
#
# 1. Per-Expert LoRA:
#    - Each expert gets independent LoRA adapters
#    - Enables specialized adaptation per expert pathway
#    - Minimal additional parameters compared to full fine-tuning
#
# 2. Memory Optimization:
#    - 4-bit quantization reduces model size by ~75%
#    - LoRA keeps trainable params at ~1-2% of model
#    - Gradient checkpointing enables larger batch sizes
#
# 3. Experts in Mixtral:
#    - 8 experts per MoE layer (configurable via architecture)
#    - Router selects 2 experts per token dynamically
#    - All experts trained simultaneously with per-expert LoRA
#
# 4. Target Modules:
#    - w1, w2, w3 are expert-specific feed-forward weights
#    - q_proj, k_proj, v_proj, o_proj are attention weights
#    - gate_proj is the gating/routing projection
#    - Adapting all improves expert specialization
#
# 5. Expert Sampling (optional advanced):
#    - uniform: treat all experts equally during training
#    - adaptive: focus on frequently-routed experts
#    - gradient-based: prioritize experts with larger gradients
