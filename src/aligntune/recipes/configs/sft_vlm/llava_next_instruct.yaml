recipe:
  name: "llava-instruct-cauldron"
  description: "Fine-tune LLaVA 1.5 7B on The Cauldron for vision-language instruction following"
  model: "llava-hf/llava-1.5-7b-hf"
  dataset: "HuggingFaceM4/the_cauldron"
  task: "vlm_sft"
  backend: "trl"
  tags: ["llava", "vlm", "vision-language", "instruction-tuning", "lora"]
  requires_auth: false
  estimated_time: "2-4 hours"
  estimated_memory: "20GB VRAM"

config:
  algo: sft

  model:
    name_or_path: "llava-hf/llava-1.5-7b-hf"
    precision: "bf16"
    is_vlm: true
    vision_tower_mode: "lora"
    image_column: "image"
    max_image_tokens: 4096
    gradient_checkpointing: true
    peft_enabled: true
    lora_rank: 16
    lora_alpha: 32
    lora_dropout: 0.05
    target_modules: ["q_proj", "k_proj", "v_proj", "o_proj"]

  datasets:
    - name: "HuggingFaceM4/the_cauldron"
      split: "train"
      max_samples: 2000
      text_column: "text"

  train:
    epochs: 1
    per_device_batch_size: 2
    per_device_eval_batch_size: 4
    gradient_accumulation_steps: 4
    learning_rate: 2e-4
    warmup_steps: 50
    max_grad_norm: 1.0
    optimizer: "adamw_torch"
    lr_scheduler: "cosine"
    logging_steps: 10
    save_interval: 500
    eval_interval: 500
    seed: 42

  logging:
    output_dir: "./output/llava-cauldron-vlm-sft"
    run_name: "llava-vlm-instruction-cauldron"
    loggers: []

  distributed:
    backend: "single"
