[build-system]
requires = ["setuptools>=61.0", "wheel", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
# Fallback for builds with no git metadata and no SETUPTOOLS_SCM_PRETEND_VERSION
# (e.g. building a wheel from an unpacked sdist locally). Keep in sync with the
# latest released tag.
fallback_version = "0.1.10"
# Don't append a local "+g<hash>" / ".dev" segment - PyPI rejects local
# versions, and the publish workflow already guards against dev versions.
local_scheme = "no-local-version"

[project]
name = "aligntune"
# Version is derived from the git tag by setuptools_scm (see [tool.setuptools_scm]
# below). CI sets SETUPTOOLS_SCM_PRETEND_VERSION to the release tag when building
# for PyPI, so a `git tag 2.0.0` publishes aligntune 2.0.0.
dynamic = ["version"]
description = "AlignTune: Multi-backend alignment and fine-tuning library. Features TRL and Unsloth backends with complete RL coverage (DPO, PPO, GRPO, BOLT), 27+ reward functions, production-ready evaluation system, and unified configuration interface for LLM alignment."
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-LSAL-1.1"
license-files = [
    "LICENSE.md",
    "THIRD_PARTY_LICENSES.md",
    # mergekit is vendored and compiled into this wheel (see setup.py); its
    # own LGPL-3.0 license and patch notes must ship inside the built
    # distribution too, not just live in the source repo.
    "third_party/mergekit/LICENSE",
    "third_party/mergekit/PATCH_NOTES.md",
    # tokenizer-extension is vendored (Apache-2.0) and compiled into the wheel.
    "third_party/tokenizer-extension/LICENSE",
]
authors = [
    {name = "Zera Lyngkhoi", email = "zera.lyngkhoi@lexsi.ai"},
    {name = "Bhavya Goyal", email = "bhavya.goyal@lexsi.ai"},
    {name = "Chirag Chawla", email = "chirag.chawla@lexsi.ai"},
    {name = "Soham Bhattacharjee", email = "soham.bhattacharjee@lexsi.ai"},
    {name = "Utsav Avaiya", email = "utsav.avaiya@lexsi.ai"},
    {name = "Ram Mohan Rao Kadiyala", email = "ram.kadiyala@lexsi.ai"},
    {name = "Mykola Khandoga", email = "mykola.khandoga@lexsi.ai"},
    {name = "Rui Yuan", email = "rui.yuan@lexsi.ai"},
    {name = "Vinay Kumar Sankarapu", email = "v.k@lexsi.ai"},
    {name = "Pratinav Seth", email = "pratinav.seth@lexsi.ai"}
]
keywords = [
    "alignment",
    "rlhf",
    "fine-tuning",
    "llm",
    "machine learning", 
    "SFT", 
    "RL", 
    "DPO", 
    "GRPO", 
    "PPO", 
    "GSPO",
    "BOLT",
    "transformers",
    "trl",
    "unsloth",
    "multi-backend",
    "reward-functions",
    "evaluation",
    "lm-eval",
    "wandb",
    "tensorboard",
    "checkpointing",
    "device-management",
    "unified-config",
    "cli"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Operating System :: OS Independent",
]

dependencies = [
    # Core ML dependencies
    "transformers==5.14.1",
    # unsloth/unsloth_zoo's own metadata caps this at <4.4.0, but that's
    # incompatible with trl==1.7.1 below (needs datasets>=4.7.0) - trl's
    # requirement wins since it's a hard pin already in use elsewhere in
    # this project. Left as a floor only; not verified against unsloth's
    # actual (not just declared) behavior at datasets>=4.7.0.
    "datasets>=2.14.0",
    "accelerate>=1.6.0",
    # Tightened from >=0.6.0 to match unsloth/unsloth_zoo's own requirement.
    "peft>=0.18.0,!=0.11.0",
    # Tightened from >=0.41.0 to match unsloth's own requirement.
    "bitsandbytes>=0.45.5,!=0.46.0,!=0.48.0",
    "torchao>=0.16.0",
    # unsloth's metadata caps this at <2.11.0 (unsloth_zoo says <2.13.0),
    # but that's stricter than reality: `from unsloth import
    # FastLanguageModel` was verified working against torch==2.11.0 already
    # installed in this project's dev environment (see
    # third_party/unsloth/PATCH_NOTES.md). Left as a floor only, same
    # reasoning as the datasets pin above - don't force a downgrade of an
    # already-working torch install based on an unverified upstream cap.
    "torch>=2.4.0",
    "torchvision",

    # Core Python dependencies
    "numpy>=1.21.0",
    "pyyaml>=6.0",
    # Tightened from >=0.17.0 to match unsloth/unsloth_zoo's own requirement.
    "huggingface-hub>=0.34.0",
    "tqdm>=4.67.1",
    "psutil>=5.9.0",

    # Data processing
    "pandas>=1.3.0",
    "scikit-learn>=1.0.0",
    "sqlglot>=20.0.0",

    # Utilities
    "click>=8.2.1",
    "rich>=12.0.0",
    "typer>=0.7.0",
    
    # Reinforcement Learning
    # "trl==0.23.0",
    # "vllm==0.11",

    # Tokenization (Teaching Old Tokenizers New Words - Purason et al. 2025).
    # tokenizer-extension (Apache-2.0) is vendored in-tree - see
    # third_party/tokenizer-extension/ and setup.py - rather than installed from
    # git, so a plain `pip install aligntune` works. transformers / tokenizers /
    # datasets / tqdm (its other runtime deps) are already listed above; the two
    # below are the remainder. dask stays optional, matching upstream - only its
    # data.py needs it and nothing in aligntune imports that module.
    "requests>=2.28.0",
    "heapdict>=1.0.1",

    # "trl==1.7.1",
    # "vllm==0.10",
    "trl[vllm]==1.7.1",

    # unsloth and unsloth_zoo (2026.7.2) are vendored in-tree - see
    # third_party/unsloth/PATCH_NOTES.md and
    # third_party/unsloth_zoo/PATCH_NOTES.md (both include AGPL-3.0-licensed
    # files alongside this project's own LSAL-1.1 code; see those files and
    # THIRD_PARTY_LICENSES.md for what's AGPL-licensed and why) - rather
    # than installed as separate distributions, so a plain
    # `pip install aligntune` is enough. The entries below are their own
    # runtime dependencies (unsloth_zoo itself is not listed - it's vendored,
    # not pip-installed).
    "wheel>=0.42.0",
    "packaging>=24.1",
    "tyro",
    "hf_transfer",
    "diffusers",
    "nest-asyncio",
    "pillow",
    "regex",
    "msgspec",
    "filelock",
    "xformers>=0.0.27.post2; (\"linux\" in sys_platform or sys_platform == \"win32\") and (platform_machine == \"AMD64\" or platform_machine == \"x86_64\")",
    "triton>=3.0.0; \"linux\" in sys_platform",
    "triton-windows; sys_platform == \"win32\" and (platform_machine == \"AMD64\" or platform_machine == \"x86_64\")",
    "cut_cross_entropy; python_version >= \"3.10\" and (sys_platform != \"darwin\" or platform_machine != \"arm64\")",
    "mlx>=0.22.0; sys_platform == \"darwin\" and platform_machine == \"arm64\"",
    "mlx-lm>=0.22.0; sys_platform == \"darwin\" and platform_machine == \"arm64\"",
    "mlx-vlm>=0.4.4; sys_platform == \"darwin\" and platform_machine == \"arm64\"",

    # Logging and monitoring
    "wandb>=0.15.0",
    "tensorboard>=2.12.0",
    "matplotlib>=3.5.0",

    # Evaluation metrics
    "evaluate>=0.4.0",
    "rouge-score>=0.1.2",
    "bert-score>=0.3.13",
    "sacrebleu>=2.3.0",
    "lm-eval>=0.4.0",
    "nltk>=3.8.0",
    
    #Extra
    "pypdf",
    "python-docx",

    # Dataset curation and HF/Parquet connectors (published on PyPI)
    "curatorkit[all]",

    # Required for SentencePiece tokenizer support (Llama, Mistral, Gemma, etc.)
    # PyICU provides Unicode script detection for merge rule validation
    "PyICU>=2.10",

    # Required for TextToLoRA/Doc2LoRA hypernetwork text embeddings, and optional
    # semantic-similarity reward/eval scoring
    "sentence-transformers>=2.2.0",

    # mergekit (model merging, notebooks 35-42) is vendored as part of this
    # package (see third_party/mergekit, PATCH_NOTES.md for the two patches
    # applied) rather than installed as a separate distribution, so a plain
    # `pip install -e .` / `uv pip install -e .` is enough - no second
    # install step. These are its own runtime dependencies, folded in here.
    "safetensors>=0.5.2",
    "pydantic>=2.10.6",
    "immutables>=0.21",
    "tokenizers>=0.20.1",
    "typing-extensions",
    "sentencepiece",
    "protobuf",
    "scipy",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-xdist>=3.0.0",
    "pytest-mock>=3.10.0",
    "pytest-timeout>=2.1.0",
    "hypothesis>=6.70.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.5.0",
    "pre-commit>=3.0.0",
]
docs = [
    "sphinx>=5.0.0",
    "sphinx-rtd-theme>=1.2.0",
    "myst-parser>=0.18.0",
    "sphinx-autodoc-typehints>=1.19.0",
]

[project.urls]
Homepage = "https://github.com/Lexsi-Labs/aligntune"
Repository = "https://github.com/Lexsi-Labs/aligntune"
Documentation = "https://aligntune.lexsi.ai"
"Bug Tracker" = "https://github.com/Lexsi-Labs/aligntune/issues"
"Changelog" = "https://github.com/Lexsi-Labs/aligntune/blob/main/CHANGELOG.md"
"Discussions" = "https://github.com/Lexsi-Labs/aligntune/discussions"

[project.scripts]
aligntune = "aligntune.cli:main"
at = "aligntune.cli:main"

# Vendored mergekit's own CLI entry points (kept identical to upstream so its
# docs/notebooks still work), now installed as part of this package.
mergekit-yaml = "mergekit.scripts.run_yaml:main"
mergekit-legacy = "mergekit.scripts.legacy:main"
mergekit-layershuffle = "mergekit.scripts.layershuffle:main"
bakllama = "mergekit.scripts.bakllama:main"
mergekit-moe = "mergekit.scripts.moe:main"
mergekit-tokensurgeon = "mergekit.scripts.tokensurgeon:main"
mergekit-extract-lora = "mergekit.scripts.extract_lora:main"
mergekit-evolve = "mergekit.scripts.evolve:main"
mergekit-pytorch = "mergekit.scripts.merge_raw_pytorch:main"
mergekit-multi = "mergekit.scripts.multimerge:main"

[project.entry-points."aligntune.trainers"]
# TRL Backend Trainers
trl_sft = "aligntune.backends.trl.sft.sft:TRLSFTTrainer"
trl_dpo = "aligntune.backends.trl.rl.dpo.dpo:TRLDPOTrainer"
trl_ppo = "aligntune.backends.trl.rl.ppo.ppo:TRLPPOTrainer"
# Unsloth Backend Trainers
unsloth_sft = "aligntune.backends.unsloth.sft.sft:UnslothSFTTrainer"
unsloth_dpo = "aligntune.backends.unsloth.rl.dpo.dpo:UnslothDPOTrainer"
unsloth_ppo = "aligntune.backends.unsloth.rl.ppo.ppo:UnslothPPOTrainer"
unsloth_grpo = "aligntune.backends.unsloth.rl.grpo.grpo:EnhancedGRPOTrainer"
unsloth_gspo = "aligntune.backends.unsloth.rl.gspo.gspo:EnhancedGSPOTrainer"

[project.entry-points."aligntune.backends"]
trl = "aligntune.backends.trl:TRLBackend"
unsloth = "aligntune.backends.unsloth:UnslothBackend"

[project.entry-points."aligntune.evaluation"]
lm_eval = "aligntune.eval.lm_eval_runner:LMEvalRunner"
custom = "aligntune.eval.custom_runner:CustomEvalRunner"

[project.entry-points."aligntune.rewards"]
registry = "aligntune.rewards.registry:RewardRegistry"
factory = "aligntune.rewards.core:RewardFunctionFactory"

# Package discovery (aligntune under src/, plus the vendored mergekit package
# living under third_party/mergekit/mergekit) is done imperatively in
# setup.py, since declarative [tool.setuptools.packages.find] only supports a
# single `where` root and can't be combined with an explicit extra package.

[tool.setuptools.package-data]
"aligntune" = [
    "*.yaml",
    "*.yml",
    "*.json",
    "*.md",
    "*.txt",
    "py.typed",
    # Branding assets (e.g. model-card banner used by push_model_to_hf)
    "assets/*.png",
    # Configuration files
    "configs/*.yaml",
    "configs/*.yml",
    "configs/*.json",
    # SFT configurations
    "sft/*.yaml",
    "sft/*.yml",
    "sft/*.json",
    # RL configurations
    "rl/*.yaml",
    "rl/*.yml",
    "rl/*.json",
    # Backend configurations
    "backends/*/*.yaml",
    "backends/*/*.yml",
    "backends/*/*.json",
    # (Excluded examples/tests/docs from package to keep library lean)
    # CLI configurations
    "cli/*.yaml",
    "cli/*.yml",
    "cli/*.json",
    # Evaluation configurations
    "eval/*.yaml",
    "eval/*.yml",
    "eval/*.json",
    # Reward configurations
    "rewards/*.yaml",
    "rewards/*.yml",
    "rewards/*.json",
]
# Vendored mergekit's own data files (architecture defs, chat templates)
"mergekit._data.architectures" = ["*.json"]
"mergekit._data.chat_templates" = ["*.jinja"]
# Vendored unsloth_zoo's own data file (diffusion_studio UI), matching its
# own upstream package-data declaration.
"unsloth_zoo.diffusion_studio" = ["*.html"]


# Black configuration
[tool.black]
line-length = 100
target-version = ['py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | __pycache__
)/
'''

# isort configuration
[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
known_first_party = ["aligntune"]
known_third_party = [
    "torch", 
    "transformers", 
    "datasets", 
    "accelerate", 
    "peft", 
    "trl", 
    "unsloth",
    "wandb",
    "numpy",
    "pandas"
]

# mypy configuration
[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "unsloth.*",
    "trl.*",
    "wandb.*",
    "tensorboard.*",
    "evaluate.*",
]
ignore_missing_imports = true

# pytest configuration
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--cov=src/aligntune",
    "--cov-report=html",
    "--cov-report=term-missing",
    "--cov-report=xml",
    "--strict-markers",
    "--strict-config",
    "-ra",
    "-v"
]
filterwarnings = [
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "gpu: marks tests that require GPU",
    "unsloth: marks tests that require Unsloth",
    "wandb: marks tests that require WandB",
]

# Coverage configuration
[tool.coverage.run]
source = ["src/aligntune"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__init__.py",
    "*/examples/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

# Ruff configuration (modern linter alternative to flake8)
[tool.ruff]
target-version = "py312"
line-length = 100
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["B011"]

# Bandit security linting
[tool.bandit]
exclude_dirs = ["tests", "examples"]
skips = ["B101", "B601"]
