name: Create release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. 0.1.10 (leave blank to auto-bump the patch of the last release)"
        required: false
        default: ""

jobs:
  github:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Make script executable
        run: chmod +x .github/scripts/release.py
      - name: Create new release
        run: .github/scripts/release.py
        env:
          GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          RELEASE_VERSION: ${{ github.event.inputs.version }}
