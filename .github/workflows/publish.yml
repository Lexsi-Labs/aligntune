name: Publish to PyPI

on:
  release:
    types: [created]

jobs:
  pypi:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SETUPTOOLS_SCM_PRETEND_VERSION: ${{ github.event.release.tag_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          # Full history + tags so setuptools_scm can resolve the version.
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Clean build artefacts
        run: rm -rf dist build ./*.egg-info

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          # Dependencies are declared in pyproject.toml (the legacy
          # requirements.txt is no longer the source of truth). unsloth /
          # unsloth_zoo / mergekit are vendored in-tree (see setup.py), so they
          # are NOT project dependencies and need no separate --no-deps install.
          pip install ".[dev]"
        continue-on-error: false

      - name: Run tests
        run:  pytest tests/
        continue-on-error: true

      - name: Build package
        run: python3 -m pip install --upgrade build && python3 -m build

      - name: Check version is non-dev
        run: |
          python -m pip install setuptools_scm
          python - << 'PY'
          from setuptools_scm import get_version
          v = get_version()
          print("Computed version:", v)
          if ".dev" in v:
              raise SystemExit(f"Refusing to publish dev version: {v}")
          PY

      - name: Publish package to PyPI
        if: success()
        run: |
          python -m pip install --upgrade twine
          python -m pip install -U packaging
          python -m twine upload dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}

      - name: Send release notes to Slack
        id: slack
        uses: slackapi/slack-github-action@v1.24.0
        with:
          channel-id: "aligntune-release"
          payload: |
            {
              "text": "AlignTune SDK release",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Version:* ${{ github.event.release.tag_name }}"
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*PyPI URL:* https://pypi.org/project/aligntune/${{ github.event.release.tag_name }}"
                  }
                }
              ]
            }
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}