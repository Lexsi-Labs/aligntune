name: Publish to PyPI

on:
  release:
    types: [created]

permissions:
  contents: read

jobs:
  pypi:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SETUPTOOLS_SCM_PRETEND_VERSION: ${{ github.event.release.tag_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name }}

      - name: Clean build artefacts
        run: rm -rf dist build ./*.egg-info

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install .
          pip install pytest
        continue-on-error: false

      - name: Dependency and syntax checks
        run: |
          pip check || echo "::warning::pip check reported dependency conflicts"
          python -m compileall -q src/ tests/
          python -m pytest tests/ --collect-only -q
        timeout-minutes: 10

      - name: Build package
        run: python3 -m pip install --upgrade build && python3 -m build

      - name: Check version is non-dev
        run: |
          python -m pip install setuptools_scm
          python - << 'PY'
          from setuptools_scm import get_version
          v = get_version()
          print("Computed version:", v)
          if ".dev" in v:
              raise SystemExit(f"Refusing to publish dev version: {v}")
          PY
          built=$(ls dist/*.whl | head -1)
          if [[ "$(basename "$built")" != "aligntune-${{ github.event.release.tag_name }}-"* ]]; then
            echo "Built artifact $built does not match release tag ${{ github.event.release.tag_name }} — refusing to publish."
            exit 1
          fi

      - name: Publish package to PyPI
        if: success()
        run: |
          python -m pip install --upgrade twine
          python -m pip install -U packaging
          python -m twine upload dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}

      - name: Send release notes to Slack
        id: slack
        uses: slackapi/slack-github-action@e28cf165c92ffef168d23c5c9000cffc8a25e117 # v1.24.0
        with:
          channel-id: "aligntune-release"
          payload: |
            {
              "text": "AlignTune SDK release",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Version:* ${{ github.event.release.tag_name }}"
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*PyPI URL:* https://pypi.org/project/aligntune/${{ github.event.release.tag_name }}"
                  }
                }
              ]
            }
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}